<!doctype html>
<meta charset="utf-8">
<title>visualizer</title>
<style>
  @font-face {
    font-family: "Display";
    src: url("./fonts/display.woff2") format("woff2");
    font-display: block;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
  body.preview { display: grid; place-items: center; height: 100vh; }
  body.preview canvas { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  #audio { position: fixed; bottom: 12px; left: 12px; width: 360px; z-index: 2; }
  body:not(.preview) #audio { display: none; }
</style>

<canvas id="c"></canvas>
<audio id="audio" controls></audio>

<!--
  CONTRACT
    window.vizReady          -> true once assets are decoded
    window.renderFrame(i)    -> draws frame i synchronously, no rAF, no random
    window.meta              -> { frames, fps, look }

  render.py drives those three and nothing else. The design lives in ./viz/,
  which can be replaced wholesale as long as renderFrame stays deterministic:
    viz/main.js      wiring, and the contract above
    viz/signals.js   frame i -> everything a look can ask about the music
    viz/palette.js   the record's own colours, and where it sits in the frame
    viz/assets.js    the expensive things, built once
    viz/looks/*.js   one file per look; ?look=<id> picks one
-->
<script type="module" src="./viz/main.js"></script>
